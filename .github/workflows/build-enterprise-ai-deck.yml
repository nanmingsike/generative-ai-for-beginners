name: Build Enterprise AI Training Deck

on:
  pull_request:
    branches: [main]
    paths:
      - 'tmp/enterprise-ai-deck/**'
      - '.github/workflows/build-enterprise-ai-deck.yml'

jobs:
  build-deck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tmp/enterprise-ai-deck/package.json

      - name: Install dependencies
        working-directory: tmp/enterprise-ai-deck
        run: npm install --no-audit --no-fund

      - name: Apply generator hotfixes
        working-directory: tmp/enterprise-ai-deck
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('generate-deck.mjs')
          s = p.read_text()
          s = s.replace("    slide.addShape(pptx.ShapeType.chevron, { x, y: l.y, w: l.w, h: 0.62, fill: { color: l.c, transparency: 60 + i * 3 }, line: { color: l.c, width: 1 } });", "    four.addShape(pptx.ShapeType.chevron, { x, y: l.y, w: l.w, h: 0.62, fill: { color: l.c, transparency: 60 + i * 3 }, line: { color: l.c, width: 1 } });")
          s = s.replace("    slide.addText(l.t, { x: x + 0.28, y: l.y + 0.12, w: l.w - 2.4, h: 0.28, fontFace: FONT, fontSize: 12.5, bold: true, color: C.white, margin: 0, fit: 'shrink' });", "    four.addText(l.t, { x: x + 0.28, y: l.y + 0.12, w: l.w - 2.4, h: 0.28, fontFace: FONT, fontSize: 12.5, bold: true, color: C.white, margin: 0, fit: 'shrink' });")
          s = s.replace("    slide.addText(l.s, { x: x + l.w - 2.2, y: l.y + 0.12, w: 1.65, h: 0.26, fontFace: FONT, fontSize: 9, color: C.text, margin: 0, align: 'right', fit: 'shrink' });", "    four.addText(l.s, { x: x + l.w - 2.2, y: l.y + 0.12, w: 1.65, h: 0.26, fontFace: FONT, fontSize: 9, color: C.text, margin: 0, align: 'right', fit: 'shrink' });")
          s = s.replace("  fs2.forEach(f => { const x = (13.333 - f.w) / 2; slide.addShape(pptx.ShapeType.chevron, { x, y: f.y, w: f.w, h: 0.72, fill: { color: f.c, transparency: 57 }, line: { color: f.c, width: 1 } }); slide.addText(f.t, { x: x + 0.35, y: f.y + 0.18, w: f.w - 0.7, h: 0.3, fontFace: FONT, fontSize: 12, bold: true, color: C.white, align: 'center', margin: 0, fit: 'shrink' }); });", "  fs2.forEach(f => { const x = (13.333 - f.w) / 2; funnel.addShape(pptx.ShapeType.chevron, { x, y: f.y, w: f.w, h: 0.72, fill: { color: f.c, transparency: 57 }, line: { color: f.c, width: 1 } }); funnel.addText(f.t, { x: x + 0.35, y: f.y + 0.18, w: f.w - 0.7, h: 0.3, fontFace: FONT, fontSize: 12, bold: true, color: C.white, align: 'center', margin: 0, fit: 'shrink' }); });")
          p.write_text(s)
          PY

      - name: Generate editable PPTX
        working-directory: tmp/enterprise-ai-deck
        run: node generate-deck.mjs

      - name: Validate PPTX package and slide count
        working-directory: tmp/enterprise-ai-deck
        run: |
          unzip -t '企业AI转型与应用实践_完整培训课件_V1.pptx'
          python - <<'PY'
          import zipfile, re
          path = '企业AI转型与应用实践_完整培训课件_V1.pptx'
          with zipfile.ZipFile(path) as z:
              slides = [n for n in z.namelist() if re.fullmatch(r'ppt/slides/slide\d+\.xml', n)]
              print('SLIDE_COUNT=', len(slides))
              if len(slides) < 70:
                  raise SystemExit(f'Expected at least 70 slides, got {len(slides)}')
          PY

      - name: Create PDF preview when LibreOffice is available
        working-directory: tmp/enterprise-ai-deck
        shell: bash
        run: |
          if command -v libreoffice >/dev/null 2>&1; then
            mkdir -p preview
            libreoffice --headless --convert-to pdf --outdir preview '企业AI转型与应用实践_完整培训课件_V1.pptx'
          else
            echo 'LibreOffice is not available on this runner; skipping PDF preview.'
          fi

      - name: Upload deck artifact
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-ai-training-deck
          path: |
            tmp/enterprise-ai-deck/企业AI转型与应用实践_完整培训课件_V1.pptx
            tmp/enterprise-ai-deck/preview/*.pdf
          if-no-files-found: error
          retention-days: 7
