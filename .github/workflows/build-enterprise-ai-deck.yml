name: Build Enterprise AI Training Deck

on:
  push:
    branches:
      - tmp/chatgpt-enterprise-ai-deck-20260731
    paths:
      - 'tmp-enterprise-ai-deck/**'
      - '.github/workflows/build-enterprise-ai-deck.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tmp-enterprise-ai-deck/**'
      - '.github/workflows/build-enterprise-ai-deck.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: tmp/chatgpt-enterprise-ai-deck-20260731

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tmp-enterprise-ai-deck/package.json

      - name: Install dependencies
        working-directory: tmp-enterprise-ai-deck
        run: npm install

      - name: Build editable PPTX
        working-directory: tmp-enterprise-ai-deck
        run: node run_build.mjs

      - name: Install QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-pptx pillow
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils

      - name: Validate deck structure
        run: |
          python - <<'PY'
          from pathlib import Path
          from pptx import Presentation
          p = Path('tmp-enterprise-ai-deck/dist/企业AI转型与应用实践_完整版_V1.pptx')
          assert p.exists(), p
          prs = Presentation(p)
          n = len(prs.slides)
          assert n >= 90, f'Expected >=90 slides, got {n}'
          empty = []
          for idx, slide in enumerate(prs.slides, 1):
              texts = []
              for sh in slide.shapes:
                  if hasattr(sh, 'text') and sh.text.strip():
                      texts.append(sh.text.strip())
              if not texts:
                  empty.append(idx)
          assert not empty, f'Empty slides: {empty}'
          print(f'Validated {n} slides; no empty slides.')
          PY

      - name: Render PDF and thumbnails
        run: |
          cd tmp-enterprise-ai-deck/dist
          libreoffice --headless --convert-to pdf --outdir . '企业AI转型与应用实践_完整版_V1.pptx'
          PDF='企业AI转型与应用实践_完整版_V1.pdf'
          mkdir -p thumbs
          pdftoppm -jpeg -r 45 "$PDF" thumbs/slide >/dev/null 2>&1
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          files = sorted(Path('thumbs').glob('slide-*.jpg'))
          imgs = [Image.open(f).convert('RGB') for f in files]
          tw, th = 320, 180
          cols = 4
          rows_per_sheet = 5
          for start in range(0, len(imgs), cols*rows_per_sheet):
              batch = imgs[start:start+cols*rows_per_sheet]
              rows = (len(batch)+cols-1)//cols
              sheet = Image.new('RGB', (cols*tw, rows*th), 'white')
              draw = ImageDraw.Draw(sheet)
              for j, im in enumerate(batch):
                  thumb = ImageOps.fit(im, (tw, th))
                  x=(j%cols)*tw; y=(j//cols)*th
                  sheet.paste(thumb,(x,y))
                  draw.rectangle((x,y,x+tw-1,y+th-1), outline=(80,80,80), width=1)
              sheet.save(f'contact-sheet-{start//(cols*rows_per_sheet)+1:02d}.jpg', quality=88)
          print(f'Rendered {len(imgs)} slide thumbnails.')
          PY

      - name: Commit generated deliverables to branch
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'ChatGPT Deck Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -f tmp-enterprise-ai-deck/dist/*.pptx tmp-enterprise-ai-deck/dist/*.pdf tmp-enterprise-ai-deck/dist/*.md tmp-enterprise-ai-deck/dist/contact-sheet-*.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'build: generate enterprise AI workshop deck [skip ci]'
            git push origin HEAD:tmp/chatgpt-enterprise-ai-deck-20260731
          fi

      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-ai-workshop-deck
          path: |
            tmp-enterprise-ai-deck/dist/企业AI转型与应用实践_完整版_V1.pptx
            tmp-enterprise-ai-deck/dist/企业AI转型与应用实践_完整版_V1.pdf
            tmp-enterprise-ai-deck/dist/qa-report.md
            tmp-enterprise-ai-deck/dist/contact-sheet-*.jpg
          retention-days: 14
